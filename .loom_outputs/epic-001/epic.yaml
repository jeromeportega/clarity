stories:
  - id: story-001-001
    title: Greenfield monorepo scaffold + DB wiring + offline test harness
    description: >-
      Stand up a pnpm-workspace monorepo with modules/finance as module #1, configure the fixed
      stack, wire libSQL/Turso + Drizzle, and gitignore all sensitive paths from commit #1.
      Establish a Vitest harness that runs offline against a file:/temp libSQL DB.
    acceptance_criteria:
      - >-
        pnpm-workspace monorepo exists with modules/finance as the first module; no code is imported
        from any prior project
      - >-
        Tailwind, shadcn/ui (copy-in), and the geist font package are configured (geist for font
        only — not @geist-ui/core)
      - A libSQL/Turso client and Drizzle ORM (schema + migrations) are wired
      - >-
        .gitignore excludes data/, raw uploads, local DB files, and .env*, and is present in the
        first commit
      - >-
        Tests and local dev use a file: libSQL DB, falling back to a per-run temp file if :memory:
        is unsupported; better-sqlite3 / on-disk SQLite is absent
      - Vitest is configured and a baseline test runs green offline
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Stand up `pnpm-workspace.yaml` with `modules/*` + `apps/*` globs; create `apps/web` (Next.js
      App Router + TS) and `modules/finance` (with `core/` and `db/` subpackages). Wire
      `modules/finance/db/client.ts` as a `createDb(opts?)` factory using `drizzle-orm/libsql` whose
      URL resolves explicit → env (`TURSO_DATABASE_URL`/`TURSO_AUTH_TOKEN`) → `file:` → per-run temp
      file, plus a `createTestDb()` returning `{ db, cleanup }` that builds a fresh schema per test;
      install Vitest (NFR-4) and prove one green offline test. Configure Tailwind + shadcn/ui
      copy-in and the `geist` font package — pin `geist`, NOT `@geist-ui/core` (FR-2), and ban
      `better-sqlite3`/on-disk sqlite (ADR-006). Commit `.gitignore` excluding `data/`, raw uploads,
      local DB files, and `.env*` in the very first commit (FR-4) — this is the one irreversible
      ordering constraint, get it into commit #1.
    test_plan: >-
      **Levels:** Integration tests for the DB factory (it touches the filesystem); config-assertion
      unit tests for the toolchain; one offline smoke test. No e2e.


      **Key cases:**

      - `createDb({ url })` honors an explicit url; with no opts it resolves env
      (`TURSO_DATABASE_URL`/`TURSO_AUTH_TOKEN`) → `file:` → per-run temp file. Cover the temp-file
      fallback path explicitly.

      - `createTestDb()` returns `{ db, cleanup }`, builds a FRESH schema per call (two calls don't
      share state), and `cleanup()` removes the temp file/handle with no leak.

      - Offline smoke: run a trivial query (e.g. `SELECT 1`) through a `createTestDb()` handle with
      no network available — proves NFR-1/NFR-3.

      - Toolchain assertions: `package.json`/lockfile contains `geist` and NOT `@geist-ui/core`;
      `better-sqlite3` and on-disk sqlite are absent from the dependency tree (ADR-006);
      `pnpm-workspace.yaml` globs `modules/*` + `apps/*`.

      - `.gitignore` content excludes `data/`, raw uploads, local DB files (`*.db`/`*.sqlite*`), and
      `.env*`. Assert it is present in the FIRST commit (`git log --diff-filter=A --follow --
      .gitignore` resolves to the root commit).


      **Verification bar:** A baseline Vitest run is green with networking unavailable, exercising
      `createDb`/`createTestDb` against a `file:`/temp libSQL DB; the workspace and stack pins
      (geist-font-only, no better-sqlite3) are machine-asserted; `.gitignore` provably ships in
      commit #1. This is the harness every later story's tests run on — it must be solid before
      proceeding.
  - id: story-001-002
    title: 'End-to-end data model: tables, refund_destination, idempotency keys'
    description: >-
      Define the full Drizzle schema the platform needs end-to-end, including tables H2/H3 will
      populate later, returns as first-class signed line items, and idempotency constraints.
      Generate and apply migrations against a fresh libSQL DB.
    acceptance_criteria:
      - households, accounts, and transactions tables are defined
      - orders and order_items are defined, with a per-shipment identifier on line items
      - receipts and receipt_items are defined as tables only (shaped for H2, unpopulated)
      - matches is defined as a table only (H3) and categories is defined as schema only (H3)
      - A store_credit_balances ledger table is defined
      - >-
        Returns are modeled as signed-negative line items carrying a refund_destination enum: card
        vs. store_credit / gift_card / account_balance
      - >-
        Idempotency keys exist: transactions on (account + date + amount + normalized merchant +
        source-row hash); order lines on (order_id + shipment + item)
      - >-
        Migrations generate and apply cleanly against a fresh libSQL DB; the schema allows more than
        one household but no multi-household feature is built
    estimated_complexity: medium
    dependencies:
      - story-001-001
    tech_notes: >-
      Author the full schema in `modules/finance/db/schema.ts` as Drizzle `sqlite-core`, then
      `drizzle-kit generate` into `modules/finance/db/migrations/`. Ship every table now
      (`households`, `accounts`, `transactions`, `orders`, `order_items`, `receipts`,
      `receipt_items`, `matches`, `categories`, `store_credit_balances`) even though H1 leaves most
      empty (ADR-004). Money is signed `integer` cents everywhere, dates are ISO `text`, IDs are
      app-generated UUID `text` PKs (ADR-001). Encode the two idempotency constraints as unique
      indexes: `ux_transactions_dedup` on `dedup_key` and `ux_order_items_line` on `(order_id,
      shipment_id, item_seq)` (ADR-003); model returns as signed-negative `order_items` rows
      carrying the `refund_destination` enum rather than a separate returns table (ADR-002). The one
      trade-off to internalize: you're committing table shapes before H3's consumers exist — favor a
      coherent reviewed-once schema over per-epic migration churn.
    test_plan: >-
      **Levels:** Integration tests against `createTestDb()` — generate/apply the real Drizzle
      migration to a fresh libSQL DB, then introspect and exercise constraints. No unit/e2e.


      **Key cases:**

      - Migration generates and applies cleanly to an empty DB; assert all ten tables exist via
      `sqlite_master`: `households`, `accounts`, `transactions`, `orders`, `order_items`,
      `receipts`, `receipt_items`, `matches`, `categories`, `store_credit_balances`.

      - `ux_transactions_dedup` enforces uniqueness on `dedup_key`: inserting a second row with the
      same `dedup_key` is rejected/ignored (proves the FR-16 transaction key is a real DB
      constraint, not query-time).

      - `ux_order_items_line` enforces uniqueness on `(order_id, shipment_id, item_seq)`: duplicate
      triple rejected; differing `item_seq` or `shipment_id` accepted.

      - Returns modeled in-table: an `order_items` row accepts a negative `amount_cents` and each
      `refund_destination` value `card`/`store_credit`/`gift_card`/`account_balance` (and NULL on
      purchases).

      - `store_credit_balances` accepts a positive accrual row with `kind` and `order_item_id` FK
      set.

      - Money columns are integer cents (reject/round-trip a signed integer; floats are not the
      storage type) per ADR-001.

      - Multi-household allowed: insert two `households` rows successfully (NFR-5 — schema permits,
      no feature gates it).

      - FK integrity: `accounts.household_id`, `transactions.account_id`, `order_items.order_id`
      reject orphan references.


      **Verification bar:** A single migration brings a fresh DB to the full end-to-end shape; both
      idempotency indexes and the signed-amount + `refund_destination` return model are demonstrably
      enforced at the storage layer; downstream (H2/H3) tables exist and accept their shaped rows.
      No second migration should ever be needed for the empty tables.
  - id: story-001-003
    title: Framework-agnostic core boundary + SourceAdapter contract
    description: >-
      Establish modules/finance/core as pure TypeScript with an automated import-boundary check, and
      define the single SourceAdapter normalization interface plus stubbed slots for the
      retailer-API and .eml adapters.
    acceptance_criteria:
      - >-
        All business logic lives in modules/finance/core as pure TypeScript with no Next.js/React
        imports; route handlers call into the core
      - >-
        An automated test/lint check fails if any Next/React import appears in modules/finance/core,
        and passes on the current tree
      - >-
        A single SourceAdapter interface is defined that normalizes input into a common
        order/receipt/transaction model
      - >-
        Retailer-API and .eml adapter slots are stubbed behind the SourceAdapter contract (interface
        present, no implementation)
    estimated_complexity: medium
    dependencies:
      - story-001-001
      - story-001-002
    tech_notes: >-
      Define the `SourceAdapter` interface in `modules/finance/core/adapters/source-adapter.ts`
      (`kind`, `supports(input)`, `normalize(input): NormalizedBatch`) and the domain types in
      `modules/finance/core/model/normalized.ts` exactly as specified — `RawInput` is file-bytes
      only, never live network (NFR-3). Add the import-boundary check as a Vitest test that scans
      `modules/finance/core/**` source for any `next`/`react` import and fails if present (ADR-009)
      — scope it to `core`, not `db`. Stub `retailer-api.adapter.ts` and `eml.adapter.ts` with
      `supports: () => false` and a `normalize()` that throws `NotImplemented` (FR-9). Trade-off:
      `NormalizedBatch` carries `transactions`/`orders`/`receipts` arrays even though each adapter
      fills only one — accept the looser type for a single uniform seam (ADR-007).
    test_plan: >-
      **Levels:** Unit tests. The boundary check is itself a Vitest test; the SourceAdapter/stubs
      get type- and behavior-level unit tests.


      **Key cases:**

      - Boundary check scans `modules/finance/core/**` source and PASSES on the current tree (zero
      `next`/`react` imports). Scope is `core` only — `db` is exempt (ADR-009).

      - Boundary check FAILS when a violation exists: feed it a fixture/temp source string
      containing `import ... from 'next/...'` (and one with `react`) and assert it reports failure —
      proves the check actually catches leaks, not just that the tree happens clean today.

      - `SourceAdapter` contract: a conforming object satisfies `{ kind, supports(input),
      normalize(input) }` and `NormalizedBatch` carries `transactions`/`orders`/`receipts`/`errors`
      arrays (type-level compile + shape assertion).

      - `retailerApiAdapter` and `emlAdapter` stubs: `supports()` returns `false`; `normalize()`
      throws `NotImplemented` (FR-9) — assert the throw, don't implement.


      **Verification bar:** The import-boundary test is part of the suite, green on the real tree,
      and provably red on an injected Next/React import. The single `SourceAdapter` seam and both
      stub slots exist and behave per contract. Note for the implementer: route handlers must call
      into the core — keep any framework code out of `core`.
  - id: story-001-004
    title: Bank statement importer (Excel/CSV) with idempotency and error path
    description: >-
      Implement the bank importer behind the SourceAdapter contract: Excel-primary (SheetJS) plus
      CSV, with header detection, date/amount normalization, idempotent re-import, and a structured
      malformed-row error path. Test-first.
    acceptance_criteria:
      - >-
        Imports bank statements with Excel (.xlsx/.xls via SheetJS) as primary and CSV also
        supported, flowing through SourceAdapter
      - >-
        Performs header-row detection, date/amount normalization (including Excel serial dates,
        guarding the 1900 leap-year bug), merchant cleanup, and credit/debit handling
      - Re-importing the same file produces no duplicate rows (transaction idempotency key)
      - Malformed rows are skipped and surfaced as structured import errors — never silently dropped
      - >-
        Vitest (written before implementation, red→green) covers normalization, idempotency, and the
        malformed-row error path
    estimated_complexity: large
    dependencies:
      - story-001-002
      - story-001-003
    tech_notes: >-
      Implement `bank-excel.adapter.ts` (and CSV) behind `SourceAdapter` in
      `modules/finance/core/adapters/`, using SheetJS (`xlsx`) reading cell **values** not formulas,
      and `csv-parse` for CSV. Normalize via `modules/finance/core/normalize/` (dates,
      amounts→signed cents, merchant cleanup) — Excel serial dates MUST guard the 1900 leap-year bug
      (FR-18), and `direction` mirrors the sign. Compute the dedup key through
      `modules/finance/core/idempotency/keys.ts#transactionDedupKey` (SHA-256 via Node `crypto`) and
      rely on `ux_transactions_dedup` insert-or-ignore for idempotency, not query-time checks.
      Malformed rows become structured `ImportError` entries in `NormalizedBatch.errors`, never
      dropped (FR-20); write the Vitest red→green first covering normalization, idempotent
      re-import, and the error path. Trade-off: two legitimately distinct
      same-day/same-amount/same-merchant rows collide unless `sourceRowHash` distinguishes them
      (ADR-003 open assumption).
    test_plan: >-
      **Levels:** Test-first (red→green). Unit tests for the `normalize/` pure functions and
      `transactionDedupKey`; integration tests for the full Excel/CSV adapter → `importSource` → DB
      path against `createTestDb()`. No e2e.


      **Key cases (write before implementation):**

      - Excel serial date normalization → ISO `YYYY-MM-DD`, INCLUDING the 1900 leap-year-bug guard:
      serial `60` must not become `1900-02-29`; verify boundary serials around it and a normal
      modern date both resolve correctly (FR-18).

      - Amount normalization → signed integer cents: debit < 0, credit > 0; parse `$1,234.56`,
      parenthesized negatives, and a credit row; assert `direction` mirrors the sign.

      - Header-row detection when the header is NOT the first row (preamble rows above it).

      - Merchant cleanup: raw merchant string → expected `normalizedMerchant`.

      - `bank-excel.adapter` `supports()` true for `.xlsx`/`.xls`; CSV path supported too; both flow
      through the `SourceAdapter` seam (SheetJS reads cell VALUES, not formulas).

      - Idempotent re-import: importing the same file twice yields `skippedDuplicates > 0` and ZERO
      new `transactions` rows on the second run — driven by `ux_transactions_dedup`, not a
      query-time check (FR-19).

      - Malformed-row error path: a file with one bad row → that row appears as a structured
      `ImportError` in `NormalizedBatch.errors`/`ImportResult.errors`, valid rows still persist, and
      nothing is silently dropped (FR-20).

      - `transactionDedupKey` is deterministic for identical inputs and differs when `sourceRowHash`
      differs (the ADR-003 same-day/same-amount disambiguation).


      **Verification bar:** Tests were red before the importer existed and are green after;
      normalization (dates incl. leap-bug, signed amounts, merchant), idempotent re-import (no
      dupes), and the never-drop error path are each covered by a named case. Sign and `direction`
      are consistent end to end.
  - id: story-001-005
    title: Amazon order importer (Retail.OrderHistory.1.csv) with returns
    description: >-
      Parse the Amazon order CSV into orders + per-shipment line items behind the SourceAdapter
      contract, handling refund/return rows and recording store-credit balance rows. Test-first.
    acceptance_criteria:
      - >-
        Parses Retail.OrderHistory.1.csv into orders + per-shipment line items, including
        per-shipment subtotals and refund/return rows, file-based with no live auth, via
        SourceAdapter
      - >-
        Refunds are recorded as signed-negative line items; refund_destination is populated where
        the source states it
      - >-
        A store-credit refund records a balance row in store_credit_balances (drawdown deferred to
        H3)
      - >-
        Re-importing the same file produces no duplicate order lines (order_id + shipment + item
        key)
      - >-
        Vitest (written before implementation, red→green) covers parser extraction, idempotency, and
        at least one return/refund case
    estimated_complexity: large
    dependencies:
      - story-001-002
      - story-001-003
    tech_notes: >-
      Implement `amazon-csv.adapter.ts` behind `SourceAdapter`, parsing `Retail.OrderHistory.1.csv`
      with `csv-parse` into `NormalizedOrder` objects each carrying `NormalizedOrderItem[]` keyed by
      `(shipmentId, itemSeq)`; file-based, no live auth. Refund/return lines are signed-negative
      `amountCents` with `isReturn` derived from sign and `refundDestination` set only where the
      source states it (ADR-002). Apply the refund decision tree: `card` refunds get NO ledger row
      (reconciled against a bank credit in H3), while `store_credit`/`gift_card`/`account_balance`
      write ONE positive `store_credit_balances` accrual row (FR-14/FR-15) — drawdown is H3, do not
      write negatives here. Idempotency rides `ux_order_items_line` `(order_id, shipment_id,
      item_seq)`; write Vitest red→green first covering extraction, re-import dedup, and at least
      one return case. The trap: any consumer filtering `amount > 0` silently drops returns —
      respect the sign convention end to end.
    test_plan: >-
      **Levels:** Test-first (red→green). Unit tests for CSV parsing/extraction; integration tests
      for the adapter → `importSource` → DB path (orders, order_items, store_credit_balances)
      against `createTestDb()`. No e2e.


      **Key cases (write before implementation):**

      - Parse a `Retail.OrderHistory.1.csv` fixture into `NormalizedOrder`s, each carrying
      `NormalizedOrderItem[]` keyed by `(shipmentId, itemSeq)`; per-shipment subtotals reflected;
      file-based, no live auth.

      - Purchase line: positive `amountCents`, `isReturn === false`, `refundDestination`
      undefined/NULL.

      - Return line: negative `amountCents`, `isReturn` derived from sign (ADR-002).

      - Refund decision tree — `refund_destination = 'card'`: NO row written to
      `store_credit_balances` (reconciled against a bank credit in H3).

      - Refund decision tree — `store_credit`/`gift_card`/`account_balance`: exactly ONE positive
      accrual row in `store_credit_balances` (drawdown deferred to H3 — assert no negative ledger
      rows are written here) (FR-14/FR-15).

      - Idempotent re-import: second import of the same file produces zero new `order_items` rows
      via `ux_order_items_line` `(order_id, shipment_id, item_seq)`.

      - Sign convention end-to-end: `SUM(amount_cents)` over an order containing a return nets to
      the true economic value — and explicitly assert a `WHERE amount > 0` filter would WRONGLY drop
      the return (guard against that trap).


      **Verification bar:** Tests were red first, green after; parser extraction (orders +
      per-shipment items + subtotals), idempotency on the line key, and at least one full
      return/refund case (including the store-credit accrual vs. card no-row branch) are each
      covered. Returns are never lost or double-counted.
  - id: story-001-006
    title: Fixtures, seed script, CLI entry point, and ingest integration test
    description: >-
      Provide sanitized real-structure fixtures including a return case, a seed script for a
      synthetic demo household, a CLI/script entry point for both importers, and an integration test
      that drives the real ingest route/service.
    acceptance_criteria:
      - >-
        Sanitized real sample fixtures (fake account numbers, real structure) exist, including at
        least one return/refund case
      - A seed script creates a synthetic demo household
      - A CLI/script entry point ingests a bank Excel export and an Amazon order CSV
      - >-
        An integration test imports the real ingest route/service (App Router route.ts or createApp
        — not a fixture app) and runs against a fresh libSQL test DB
    estimated_complexity: medium
    dependencies:
      - story-001-004
      - story-001-005
    tech_notes: >-
      Add sanitized-real fixtures (fake account numbers, real structure, FR-22) under a
      gitignored-safe fixtures path including at least one return/refund case; build
      `modules/finance/scripts/seed.ts` (one demo household, NFR-5) and
      `modules/finance/scripts/ingest.ts` as the CLI entry that resolves/validates a file path,
      reads bytes, builds `RawInput`, and calls `importSource(createDb(), input, ctx)` for both bank
      Excel and Amazon CSV. The integration test must import the REAL
      `apps/web/app/api/ingest/{bank,orders}/route.ts` (or a real `createApp`) — not a fixture app
      (FR-25) — and run against `createTestDb()`. Keep `route.ts` thin: request parsing and response
      shaping only, all logic via `importSource` returning `ImportResult`. Trade-off: validate CLI
      paths and read bytes only, never execute, to close path-traversal.
    test_plan: >-
      **Levels:** Unit tests for the CLI path handling and seed; one true INTEGRATION test driving
      the real ingest route against `createTestDb()`. No e2e.


      **Key cases:**

      - Fixtures exist with real STRUCTURE but sanitized data (fake account numbers / `last_four`
      only, no full PAN), and include at least one return/refund case (FR-22). Assert fixtures
      contain no real-PII patterns.

      - `seed.ts` creates exactly one synthetic demo household (NFR-5) — running it yields one
      `households` row and the expected linked account(s).

      - `ingest.ts` CLI: resolves and validates the input path, reads bytes only (never executes),
      builds `RawInput`, and calls `importSource(createDb(), input, ctx)` for both a bank Excel and
      an Amazon CSV fixture → returns an `ImportResult`. Include a path-traversal case: a
      malicious/escaping path is rejected, not opened.

      - Integration test imports the REAL `apps/web/app/api/ingest/bank/route.ts` and
      `.../orders/route.ts` (or a real `createApp`) — NOT a fixture app (FR-25): POST
      multipart/form-data `{ file, accountId }`, assert 200 with a well-formed `ImportResult`, and
      that rows landed in the fresh test DB. Assert the route is thin — logic lives in
      `importSource`.


      **Verification bar:** Sanitized real-structure fixtures (incl. a return), a one-household
      seed, a working CLI for both importers, and an integration test that exercises the actual
      route module against `createTestDb()` all pass. The integration test must fail if the route
      stops delegating to the core.
  - id: story-001-007
    title: Run full build + test suite and verify H1 success criteria end-to-end
    description: >-
      Run the whole suite offline and confirm the cross-cutting H1 acceptance gates: real-file
      ingestion, core-boundary check, and no real data in git. Fix any cross-cutting regressions
      surfaced when everything runs together.
    acceptance_criteria:
      - The full Vitest suite is green, runs offline, and uses a file:/temp libSQL DB
      - A real bank Excel export ingests cleanly via CLI/script
      - A real Amazon order CSV ingests cleanly via CLI/script
      - The core-import-boundary check passes (no Next/React imports in modules/finance/core)
      - >-
        No real financial data is committed to git, and .gitignore proves the exclusion from commit
        #1
    estimated_complexity: small
    dependencies:
      - story-001-001
      - story-001-002
      - story-001-003
      - story-001-004
      - story-001-005
      - story-001-006
    tech_notes: >-
      This is a verification/integration-cleanup story, not new feature code — run the full Vitest
      suite offline against the `file:`/temp libSQL DB and fix only cross-cutting regressions that
      surface when everything runs together. Confirm the four H1 gates: a real bank Excel and a real
      Amazon CSV ingest cleanly via `scripts/ingest.ts`, the core-boundary check (story-001-003)
      passes, and `.gitignore` provably excludes real data from commit #1 (FR-4) — verify via `git
      log` on the `.gitignore` itself. Trade-off: PDF bank statements are intentionally not
      ingestible in H1 and must never block the suite going green (ADR-010); if anything is red, fix
      the root cause rather than skipping tests.
    test_plan: >-
      **Levels:** Whole-suite verification + cross-cutting gate checks. No new feature tests — this
      story confirms the H1 acceptance gates hold when everything runs together and fixes only
      cross-cutting regressions (root-cause, never skip/quarantine).


      **Key cases:**

      - Full Vitest suite runs GREEN with networking unavailable and uses a `file:`/temp libSQL DB
      throughout (Goal 4 / NFR-1).

      - Real bank Excel export ingests cleanly via `scripts/ingest.ts` — `ImportResult` reports
      inserted rows and no unexpected errors; a re-run inserts zero new rows.

      - Real Amazon order CSV ingests cleanly via `scripts/ingest.ts` with the same idempotency
      property.

      - Core-import-boundary check (from story-001-003) passes on the full tree: zero Next/React
      imports in `modules/finance/core`.

      - Git hygiene gate: `git ls-files` tracks no real financial data (`data/`, raw uploads, DB
      files, `.env*`); `git log --diff-filter=A -- .gitignore` proves `.gitignore` shipped in commit
      #1 with those exclusions (FR-4/NFR-2).

      - PDF bank statements are intentionally NOT ingestible in H1 and must not appear as a
      failing/blocking test (ADR-010) — confirm nothing red stems from a deferred PDF path.


      **Verification bar:** All four H1 gates demonstrably hold simultaneously — offline green suite
      on `file:`/temp DB, both real files ingest via CLI, boundary check passes, and no real data is
      (or ever was) in git. Any red is fixed at the root cause, not silenced.
