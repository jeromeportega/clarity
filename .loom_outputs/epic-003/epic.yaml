stories:
  - id: story-003-001
    title: Domain model, synthetic fixtures, and tuned threshold constants
    description: >-
      Establish the pure-TypeScript domain model in modules/finance/core for bank lines, receipts,
      receipt_items, Amazon order CSV rows, and store_credit_balances, plus the synthetic fixture
      harness every downstream test consumes. Define matching thresholds (tip/adjustment tolerance,
      merchant-similarity cutoff, date-window widths, confidence cutoff) as named, documented
      constants.
    acceptance_criteria:
      - >-
        Domain types for all five sources (bank line, receipt, receipt_items, Amazon order CSV row,
        store_credit_balances) are defined in modules/finance/core with no Next.js or React import.
      - >-
        Synthetic fixtures matching the real formats exist and span ≥3 months of data for later
        baseline comparisons.
      - >-
        All matching thresholds are named, documented constants with sane defaults tuned to the
        fixtures (FR-14).
      - A gate-safety check confirms no real data and no API keys are present anywhere in the gate.
      - Vitest runs over this package are fast, deterministic, and fully offline.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Author `core/reconcile/model.ts` (all types from the architecture: `BankLine`,
      `OrderView`/`OrderItemView`, `ReceiptView`/`ReceiptItemView`, `StoreCreditAccrual`,
      `ReconcileInputs`, and the output types `MatchRecord`, `LedgerEvent`, `ReconciledLedger`,
      `StoreCreditDrawdown`), plus `core/rollups/model.ts` and `core/insights/model.ts`; import
      `RefundDestination` from H1's `core/model/normalized` rather than re-declaring it. Put every
      tuned constant in `core/reconcile/thresholds.ts` as the documented `ReconcileConfig` interface
      with the exact defaults from the architecture (tipAdjustmentToleranceCents 1500,
      merchantSimilarityCutoff 0.72, confidenceThreshold 0.70, etc.) and build the
      `FixtureReconcileSource`/synthetic fixtures spanning ≥3 months so 003-007's baseline
      comparisons have data. Also own the additive migration `0002_h3_matches` (`ALTER TABLE matches
      ADD COLUMN rationale TEXT` + `store_credit_balance_id`) and a gate-safety vitest that fails on
      any key-shaped or PAN-shaped string in fixture JSON. The one trade-off: money is signed
      integer cents and this story owns the single bank-sign→spend-sign flip documented in
      `model.ts` — get it wrong here and every downstream net-spend total inverts.
    test_plan: >-
      **Levels:** unit (Vitest) only — this is pure type/fixture/constant scaffolding with no
      runtime behavior beyond the fixtures and one gate-safety scan. **Key cases (checklist):**

      - [ ] **Compile/type smoke:** a `.test.ts` that imports every domain type from
      `core/reconcile/model.ts` (`BankLine`, `OrderView`/`OrderItemView`,
      `ReceiptView`/`ReceiptItemView`, `StoreCreditAccrual`, `ReconcileInputs`, `MatchRecord`,
      `LedgerEvent`, `ReconciledLedger`, `StoreCreditDrawdown`), `core/rollups/model.ts`,
      `core/insights/model.ts`, and constructs one literal of each — proves the model exists and is
      internally consistent (AC1).

      - [ ] **No framework imports:** assert via a source-scan test (read the `core/**/*.ts` files,
      regex for `from 'next` / `from 'react'`) that no Next.js or React import appears anywhere in
      the package (AC1, NFR-1).

      - [ ] **`RefundDestination` is reused, not redeclared:** assert the imported union from H1's
      `core/model/normalized` is used in `OrderItemView`/`StoreCreditAccrual`; a duplicate local
      declaration is a defect.

      - [ ] **Fixtures span ≥3 months:** load `FixtureReconcileSource` fixtures and assert distinct
      `YYYY-MM` buckets across bank/order/receipt dates is ≥3 (AC2) — 003-007 baselines depend on
      this.

      - [ ] **Fixture realism:** assert fixtures contain at least one of each input kind (bank line
      debit+credit, order with items, receipt with items, store-credit accrual) so downstream
      stories have data.

      - [ ] **Threshold constants present & defaulted:** assert `ReconcileConfig` defaults are
      exactly the documented values (`tipAdjustmentToleranceCents=1500`,
      `merchantSimilarityCutoff=0.72`, `receiptDateWindowDays=3`, `orderDateWindowDays=7`,
      `subsetMaxCandidates=12`, `confidenceThreshold=0.70`, `recurringAmountToleranceCents=200`,
      `recurringCadenceToleranceDays=3`, `insightComparisonMonths=3`) (AC3, FR-14).

      - [ ] **Sign-flip correctness (the load-bearing one):** unit-test the single
      bank-sign→spend-sign mapping in `model.ts` — bank purchase debit `-1234` → `signedSpendCents
      +1234`; bank refund credit `+1234` → `-1234`. Assert both directions; a wrong sign here
      inverts every downstream net total.

      - [ ] **Gate-safety scan:** a test that walks all fixture JSON and FAILS on any API-key-shaped
      string (e.g. `sk-`, `AKIA`, long base64-ish secrets) or PAN-shaped string (13–19 consecutive
      digits passing a Luhn-ish/length check) (AC4, NFR-3). Verify it actually fails by feeding it a
      poisoned in-memory fixture in the same test.

      - [ ] **Migration shape:** assert `0002_h3_matches` adds `rationale TEXT` and
      `store_credit_balance_id` (string assertion over the migration SQL is sufficient; no DB
      needed).

      **Verification bar:** all five sources have Next/React-free types; fixtures span ≥3 months and
      carry every input kind; every `ReconcileConfig` constant matches the documented default; the
      sign-flip is proven in both directions; the gate-safety scan demonstrably catches a planted
      secret/PAN; `vitest run` for the package is offline and deterministic (no network, no
      clock/random reliance).
  - id: story-003-002
    title: Matching engine with persisted rationale, confidence, and review-queue routing
    description: >-
      Implement receipt↔bank matching (amount with tip/adjustment tolerance, date window,
      merchant-string similarity, card last-4) and Amazon-order↔bank matching via bounded
      sum-of-subsets within a date window to resolve split shipments. Persist rationale text +
      numeric confidence per match and route below-threshold matches to the review queue. Matcher
      tests are authored before implementation.
    acceptance_criteria:
      - Matcher unit tests are authored first (red → green) before the matching implementation.
      - On synthetic fixtures, ≥3 receipt↔bank matches are produced (FR-1).
      - >-
        ≥2 Amazon-order↔bank matches are produced, including ≥1 split-shipment case resolved via
        sum-of-subsets (FR-2).
      - The Amazon source is the order CSV, not email parsing.
      - Every match persists rationale text and a numeric confidence value (FR-3).
      - >-
        Matches below the named confidence threshold are routed to the review queue and never
        auto-linked (FR-4).
      - >-
        The sum-of-subsets candidate pool is bounded by date-window + amount to keep the search
        tractable.
    estimated_complexity: large
    dependencies:
      - story-003-001
    tech_notes: >-
      Implement `core/reconcile/match/index.ts` (`matchReceipts`, `matchAmazonOrders`) and
      `core/reconcile/match/subset-sum.ts` (`findChargeSubset`); reuse H2's `similarityRatio`
      (Sørensen–Dice bigram) from `core/receipts` for merchant comparison rather than adding a
      dependency, and gate amount equality through `tipAdjustmentToleranceCents`/date windows from
      `ReconcileConfig`. Write the matcher unit tests first (red→green) per NFR-4. Each
      `MatchRecord` must carry `confidence`, a human-readable `rationale` (FR-3), and `status` set
      to `'review'` whenever `confidence < confidenceThreshold` (FR-4) — never auto-link below
      threshold. The one trade-off: split-shipment resolution is a bounded DFS pruned to
      `orderDateWindowDays` + `subsetMaxCandidates` (default 12); a genuine split outside that
      window routes to review instead of brute-forcing — honest failure over coverage, so don't
      widen the bound to chase a fixture.
    test_plan: >-
      **Levels:** unit (Vitest) only — `matchReceipts`, `matchAmazonOrders`, `findChargeSubset` are
      pure functions over fixtures. **Tests are authored FIRST (red → green) per NFR-4 — write
      failing matcher tests before the implementation.** **Key cases (checklist):**

      *Receipt↔bank (`matchReceipts`, FR-1):*

      - [ ] **Happy path ≥3 matches:** on fixtures, assert ≥3 `receipt_bank` `MatchRecord`s are
      produced (AC2).

      - [ ] **Tip/adjustment tolerance:** receipt total within `tipAdjustmentToleranceCents` of the
      bank amount matches; just outside the band does NOT.

      - [ ] **Date window:** receipt within `receiptDateWindowDays` matches; one day outside does
      not.

      - [ ] **Merchant similarity gate:** merchant pair with Dice ratio ≥ `merchantSimilarityCutoff`
      (reuse H2 `similarityRatio`) matches; below cutoff is rejected/lowered. Verify it CALLS the
      shared `similarityRatio`, not a new impl.

      - [ ] **last-4 boost:** matching `lastFour` raises confidence / disambiguates between two
      same-amount candidates; mismatched last-4 lowers it.

      *Amazon↔bank (`matchAmazonOrders` + `findChargeSubset`, FR-2):*

      - [ ] **Single-charge order match:** an order total equal to one bank charge in-window
      produces an `order_bank` match.

      - [ ] **Split shipment ≥1 case:** an order whose total = sum of 2+ bank charges resolves via
      `findChargeSubset` to an `order_bank_split`; assert the exact subset returned (AC3).

      - [ ] **Subset pool is bounded:** with > `subsetMaxCandidates` candidates or charges outside
      `orderDateWindowDays`, `findChargeSubset` returns `null` and the order routes to **review**
      rather than brute-forcing (AC7, ADR-003). Do NOT widen the window to chase a fixture.

      - [ ] **No subset exists:** `findChargeSubset` returns `null` (not a wrong partial match).

      *Cross-cutting (FR-3/FR-4):*

      - [ ] **Rationale + confidence persisted:** every emitted `MatchRecord` has a non-empty
      `rationale` string and a numeric `confidence ∈ [0,1]` (AC5).

      - [ ] **Review-queue routing:** a deliberately weak fixture match yields `confidence <
      confidenceThreshold` ⇒ `status:'review'`, and it is NEVER `auto_linked` (AC6, FR-4). A strong
      match yields `status:'auto_linked'`.

      - [ ] **Source is CSV not email:** assert the order input is `OrderView` (from order CSV);
      there is no email-parsing code path (AC4).

      **Verification bar:** matcher tests existed and failed before implementation; fixtures yield
      ≥3 receipt matches and ≥2 order matches including ≥1 subset-sum split; every match carries
      rationale + numeric confidence; sub-threshold matches land in the review queue and never
      auto-link; the subset search is provably bounded (returns `null` → review past the bound).
  - id: story-003-003
    title: Dedup single-counting invariant
    description: >-
      When a transaction has both a receipt and an Amazon order matched to the same bank line, merge
      item detail and count the underlying dollar exactly once. This is the product's central
      invariant; its failing test is written first.
    acceptance_criteria:
      - The dedup-invariant test is authored before implementation (red → green).
      - ≥1 dedup case links receipt + order + bank with the dollar counted exactly once (FR-5).
      - >-
        Merged item detail from receipt and order is preserved on the single counted event without
        double-counting.
    estimated_complexity: small
    dependencies:
      - story-003-002
    tech_notes: >-
      Implement `core/reconcile/dedup.ts:mergeCounted(matches, inputs)` returning one `LedgerEvent`
      per anchored transaction, with the dollar counted exactly once and receipt+order item detail
      unioned into `mergedItems`. Write the failing single-counting test first (this is the
      product's headline invariant, FR-5/NFR-4) — assert `netSpend === Σ counted bank anchors` and
      that a receipt+order+bank triple counts the amount once. Follow ADR-002's anchor precedence
      (bank line > store-credit ledger row > receipt total) so the anchor is deterministic, not
      emergent from join order. The one trade-off: this is a small, pure function but it is the
      correctness keystone — keep it free of matching/refund logic so the invariant stays provable
      in isolation.
    test_plan: >-
      **Levels:** unit (Vitest) only — `mergeCounted(matches, inputs)` is a pure function. **The
      dedup-invariant test is authored FIRST (red → green) — it is the product's headline invariant
      (FR-5/NFR-4).** Keep this function free of matching/refund logic so the invariant is provable
      in isolation. **Key cases (checklist):**

      - [ ] **The dedup triple (the keystone):** a fixture where a receipt AND an Amazon order both
      match the same bank transaction produces exactly ONE `LedgerEvent` carrying the bank line's
      amount once. Assert `events.length === 1` for that anchor and `signedSpendCents` equals the
      single bank amount (AC2, FR-5).

      - [ ] **Item detail unioned, not summed:** that single event's `mergedItems` contains item
      detail from BOTH receipt and order, but the counted dollar is the bank amount — assert `Σ
      mergedItems` is NOT added on top of the anchor amount (AC3).

      - [ ] **Net-spend property:** assert `netSpendCents === Σ counted bank anchors` across the
      whole fixture (no double-count from join order).

      - [ ] **Anchor precedence (ADR-002):** verify bank line > store-credit ledger row > receipt
      total — a purchase with a bank line anchors on it even when a receipt total is also present; a
      fully store-credit-funded purchase (no bank line) anchors on the ledger row.

      - [ ] **Receipt-only / order-only (no false merge):** a receipt matched alone, and an order
      matched alone, each yield their own single event — merging only collapses sources sharing one
      anchor.

      **Verification bar:** the failing single-counting test was written first; the
      receipt+order+bank triple counts the dollar exactly once with both sources' item detail
      preserved on one event; `netSpend === Σ counted anchors` holds; anchor selection is
      deterministic per ADR-002, not emergent from input order.
  - id: story-003-004
    title: Returns, refunds, and store-credit ledger drawdown
    description: >-
      Handle refunds as signed-negative events: card refunds reconcile against a bank CREDIT line;
      store_credit/gift_card/account_balance refunds post to the store_credit_balances ledger and
      are never flagged unmatched. Reconcile partial store-credit payments (bank charge < receipt
      total) against the ledger, and compute net spend as purchases − refunds.
    acceptance_criteria:
      - >-
        ≥1 card refund is matched to a bank CREDIT line, signed negative, with net spend correct
        (FR-6).
      - >-
        ≥1 store-credit refund posts to the store_credit_balances ledger with no bank line and is
        not flagged unmatched, with net spend correct (FR-7).
      - The test 'refund to store credit → bank shows nothing → net spend still correct' passes.
      - >-
        A partial store-credit payment (bank charge < receipt total) reconciles the gap against the
        ledger rather than recording a mismatch (FR-8).
      - Net spend is computed as purchases − refunds (FR-9).
    estimated_complexity: medium
    dependencies:
      - story-003-002
    tech_notes: >-
      Implement `core/reconcile/refunds.ts:reconcileRefunds(inputs, matches)` plus the store-credit
      drawdown logic, emitting refunds as signed-NEGATIVE `LedgerEvent`s. Route by
      `RefundDestination`: `'card'` matches a bank CREDIT line;
      `'store_credit'`/`'gift_card'`/`'account_balance'` link to the originating
      `store_credit_balances` accrual via `MatchRecord.storeCreditBalanceId` and must NEVER land in
      `unmatched` (FR-7). Partial store-credit payment (bank charge < receipt total) emits a
      negative `StoreCreditDrawdown` row for the gap (FR-8), and you must validate drawdowns against
      available accrual per kind — an over-drawdown routes to review rather than writing a negative
      balance. The one trade-off: net spend is funding-source-agnostic (ADR-005), so a fully
      store-credit-funded purchase shows as spend in a month where no bank money moved — correct for
      'what we consumed', and the canonical 'refund→store credit→bank shows nothing→net still
      correct' test pins it.
    test_plan: >-
      **Levels:** unit (Vitest) only — `reconcileRefunds(inputs, matches)` and the drawdown logic
      are pure. **Key cases (checklist):**

      - [ ] **Card refund → bank CREDIT, signed negative:** a `'card'` refund matches a bank CREDIT
      line and emits a NEGATIVE `signedSpendCents` `LedgerEvent`; assert net spend drops by the
      refund amount (AC1, FR-6).

      - [ ] **Store-credit refund, no bank line, never unmatched (the canonical test):** a
      `'store_credit'` refund links to its originating `store_credit_balances` accrual via
      `MatchRecord.storeCreditBalanceId`, emits a negative event, and is NEVER present in
      `ReconciledLedger.unmatched` — this is the named "refund → store credit → bank shows nothing →
      net spend still correct" test (AC2, AC3, FR-7). Cover `'gift_card'` and `'account_balance'`
      the same way.

      - [ ] **Partial store-credit payment (FR-8):** bank charge < receipt total emits a negative
      `StoreCreditDrawdown` for the gap and reconciles it against the ledger rather than recording a
      mismatch/unmatched (AC4). Assert the drawdown amount = receipt total − bank charge and that
      the event still counts the full goods value (ADR-005).

      - [ ] **Over-drawdown guard:** a drawdown exceeding available accrual for that `kind` routes
      to **review** rather than writing a negative `store_credit_balances` balance (Security Model).
      Assert no invalid negative-balance state is produced.

      - [ ] **Net spend = purchases − refunds (FR-9):** assert `netSpendCents` over a fixture mixing
      purchases + card refund + store-credit refund equals Σ signed events.

      - [ ] **Refund-then-respend nets to zero new outflow (ADR-005):** a store-credit refund (−X)
      followed by re-spend (+X) of that credit nets to zero additional net spend.

      **Verification bar:** card refunds reduce net spend via a matched CREDIT line;
      store-credit/gift-card/account-balance refunds reconcile against the ledger and are absent
      from `unmatched`; the canonical "bank shows nothing → net still correct" test passes; partial
      payments produce a correct negative drawdown without going negative-balance; net spend =
      purchases − refunds across the fixture.
  - id: story-003-005
    title: Item-level classifier with rationale, recurring detection, and merchant fallback
    description: >-
      Classify every line item to a category from H1's taxonomy with a one-line rationale. Include
      recurring-pattern detection (same merchant + amount + cadence → mortgage/utility/subscription)
      and merchant-level fallback classification for unmatched bank lines that carry no item data.
      Gate tests cover the heuristic/deterministic path only.
    acceptance_criteria:
      - >-
        Every line item is classified to a category from H1's taxonomy and carries a one-line
        rationale (FR-10).
      - >-
        Recurring patterns (same merchant + amount + cadence) are detected and classified as
        mortgage/utility/subscription.
      - Unmatched bank lines without item data receive merchant-level fallback classification.
      - >-
        Gate tests cover only the offline heuristic/deterministic path; any LLM assist is non-gated
        and optional (NFR-5).
    estimated_complexity: medium
    dependencies:
      - story-003-001
    tech_notes: >-
      Implement `core/classify/classifier.ts`: the gated default is a pure heuristic `Classifier`
      (keyword/rule over H1's `categories` taxonomy) emitting a `ClassifiedItem` with a one-line
      `rationale` (FR-10); add `detectRecurring(events, cfg)` clustering on normalized merchant +
      amount (±`recurringAmountToleranceCents`) + monthly cadence (±`recurringCadenceToleranceDays`)
      labeling mortgage/utility/subscription, and `merchantFallback(line, taxonomy)` for unmatched
      bank lines with no item data. Clamp every returned category to the H1 taxonomy. The one
      trade-off: define the optional `LlmClassifier` behind the same `Classifier` interface but
      NEVER wire it in `vitest run` (NFR-5/ADR-007) — mirror H2's `VisionProvider` quarantine; gate
      accuracy is limited to heuristics by design, and recurring detection only catches
      amount-stable charges.
    test_plan: >-
      **Levels:** unit (Vitest) only — heuristic `Classifier`, `detectRecurring`, `merchantFallback`
      are pure and offline. **Gate covers ONLY the deterministic heuristic path; the optional
      `LlmClassifier` is defined behind the same interface but NEVER wired in `vitest run`
      (NFR-5/ADR-007).** **Key cases (checklist):**

      - [ ] **Every item classified + rationale (FR-10):** for each line item in a fixture,
      `classify(...)` returns a `ClassifiedItem` whose `category` ∈ H1 taxonomy and whose
      `rationale` is a non-empty one-liner (AC1). Assert zero unclassified items.

      - [ ] **Category clamped to taxonomy:** feed an input that could tempt an out-of-taxonomy
      label; assert the returned category is always a member of the provided `taxonomy` array.

      - [ ] **Recurring detection (FR-10):** a fixture with the same normalized merchant + amount
      (±`recurringAmountToleranceCents`) on a monthly cadence (±`recurringCadenceToleranceDays`) is
      detected by `detectRecurring(events, cfg)` and labeled mortgage/utility/subscription; assert
      the rationale cites merchant + amount + observed cadence (AC2). Negative case: amounts
      drifting beyond tolerance are NOT clustered as recurring (ADR-009 — amount-stable only).

      - [ ] **Merchant fallback (no item data):** an unmatched bank line with no receipt/order items
      gets a category from `merchantFallback(line, taxonomy)` with a rationale (AC3); assert it
      still lands in the taxonomy.

      - [ ] **Deterministic & offline:** assert the gated path constructs no SDK client / makes no
      network call (the `LlmClassifier` seam exists but is never invoked in tests) (AC4).

      **Verification bar:** 100% of line items carry a taxonomy category + one-line rationale;
      recurring fixed obligations are detected and labeled with a citing rationale while non-stable
      amounts are not; item-less bank lines get a merchant-level fallback; the LLM path is
      unreferenced by any gated test and the suite stays offline/deterministic.
  - id: story-003-006
    title: Net true-spend rollups by category × month with correction-aware path
    description: >-
      Produce true-spend rollups queryable by category × month, computed on net spend and consistent
      with the matches. Expose a correction-aware rollup path that reflects review-queue corrections
      when applied, exercised by fixtures simulating an applied H4 correction.
    acceptance_criteria:
      - >-
        Rollups are queryable by category × month and computed on net spend, not gross (FR-11,
        FR-9).
      - A consistency test confirms rollups agree with the underlying matches.
      - >-
        A correction-aware rollup path reflects an applied review-queue correction, verified via a
        simulated-correction fixture (FR-12).
    estimated_complexity: medium
    dependencies:
      - story-003-002
      - story-003-004
      - story-003-005
    tech_notes: >-
      Implement `core/rollups/rollup.ts:rollupNetSpend(ledger)` producing `RollupCell[]` keyed by
      (category, month YYYY-MM) summing `signedSpendCents` (NET, not gross — FR-11/FR-9) and
      carrying `eventIds` for traceability, plus `applyCorrections(ledger, corrections)` as a PURE
      transform returning a new `ReconciledLedger` over which rollups recompute (ADR-008). Add a
      consistency test asserting rollups agree with the underlying `matches`, and a
      simulated-correction fixture (H4 doesn't exist yet) that encodes an applied `Correction` so
      both before/after rollups are testable today. The one trade-off: you commit to the
      `Correction` shape (`relink_match`/`reject_match`/`reclassify_item`) before H4 is designed —
      keep it localized to the one type and one function so it's cheap to adjust when H4 lands.
    test_plan: >-
      **Levels:** unit (Vitest) only — `rollupNetSpend(ledger)` and `applyCorrections(ledger,
      corrections)` are pure transforms. **Key cases (checklist):**

      - [ ] **Rollup by category × month on NET (FR-11/FR-9):** `rollupNetSpend` returns
      `RollupCell[]` keyed by (`category`, `month` `YYYY-MM`) summing `signedSpendCents`; assert a
      cell whose total reflects a purchase MINUS a refund in the same category×month is net, not
      gross (AC1).

      - [ ] **Traceability:** each `RollupCell.eventIds` lists exactly the events feeding that cell;
      assert Σ of cell `netSpendCents` = ledger `netSpendCents`.

      - [ ] **Consistency with matches (AC2):** a test asserting the rollup totals reconcile with
      the underlying `matches`/`events` — no event counted in two cells, none dropped.

      - [ ] **`applyCorrections` is pure (ADR-008):** assert it returns a NEW `ReconciledLedger` and
      does not mutate the input (deep-equality check on the original after the call).

      - [ ] **Correction-aware path (FR-12):** a simulated-correction fixture encoding an applied
      `Correction` — test all three kinds at least once across the suite: `reclassify_item` (event
      moves category → rollup cell shifts), `reject_match` (event/dollars removed → cell drops),
      `relink_match` (event re-anchored → moves cell). Assert before-rollup and after-rollup differ
      exactly as the correction dictates (AC3).

      **Verification bar:** rollups are queryable by category×month, computed on net (purchases −
      refunds) and provably consistent with the underlying matches (totals reconcile, eventIds
      trace); `applyCorrections` is a non-mutating pure transform and a simulated applied correction
      visibly and correctly changes the recomputed rollup.
  - id: story-003-007
    title: In-app insight flags over rollups
    description: >-
      Derive ≥2 in-app insight flags from the rollups (e.g. merchant trip above 3-month average,
      category tracking over last month, new recurring charge), each carrying its number and
      comparison basis. Define explicit behavior when history is shorter than the comparison window.
    acceptance_criteria:
      - ≥2 insight flags compute correctly, each carrying its number and comparison basis (FR-13).
      - Flags are in-app only; no outbound notifications of any kind are produced.
      - >-
        Behavior for history shorter than the comparison window (e.g. <3 months) is defined and
        tested (NFR-6).
    estimated_complexity: small
    dependencies:
      - story-003-006
    tech_notes: >-
      Implement `core/insights/flags.ts:deriveInsights(rollup, ledger, cfg)` returning ≥2
      `InsightFlag`s (e.g. `merchant_above_avg`, `category_tracking_over`, `new_recurring_charge`),
      each populating the `number` block (observed/comparison/deltaPct) and a `basis` string citing
